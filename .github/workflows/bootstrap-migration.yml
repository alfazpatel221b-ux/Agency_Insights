name: Build sanitized portfolio source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event.head_commit.message == 'Bootstrap sanitized application source' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import and sanitize exact source snapshot
        env:
          SOURCE_REPO: https://github.com/alfazpatel-dentsu/Apex_Insights.git
          SOURCE_COMMIT: 6f3a2db40b69ccdc371cb8bb500391894bded373
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --quiet "$SOURCE_REPO" "$tmp/source"
          git -C "$tmp/source" checkout --quiet "$SOURCE_COMMIT"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude=.git/ "$tmp/source/" ./
          rm -rf "$tmp" .env project-full.zip studio-backup.tar.gz .agents .idx .vscode functions/lib
          rm -f AGENTS.md functions/.env functions/.env.*

          find src functions -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.json' \) -print0 | xargs -0 perl -pi -e 's/\bDentsu\b/Company/g; s/\bdentsu\.com\b/example.com/g; s/\bAZTEC\b/AGENCY INSIGHTS/g; s/\bAztec\b/Agency Insights/g; s/\baztec\b/agency-insights/g; s/\baztec_alerts/alerts/g; s/\bAztec_Alerts/Agency Insights Alerts/g; s/azteccontrolcenter/agency-insights-demo/g; s/AZTEC_CONTROL_CENTER/AGENCY_INSIGHTS/g; s/AZTEC_/AGENCY_INSIGHTS_/g; s/Aztec_/Agency_/g; s/\bMyntra\b/Orion Retail/g; s/\bOLA\b/Nova Mobility/g; s/\bmyntra\b/orion retail/g; s/\bola\b/nova mobility/g'
          find src functions -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/is(?:MyntraOrOla|Orion RetailOrOla|OlaOrOrion Retail|OlaOrMyntra)(?:Client)?/isLargeSyntheticClient/g'
          if [ -f src/components/sokrati-logo.tsx ]; then mv src/components/sokrati-logo.tsx src/components/agency-insights-logo.tsx; fi
          find src -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 perl -pi -e 's/sokrati-logo/agency-insights-logo/g; s/SokratiLogo/AgencyInsightsLogo/g; s/Agency Insights Control Center/Agency Insights/g; s/AGENCY INSIGHTS CONTROL CENTER/AGENCY INSIGHTS/g; s/Aztec Admin/Agency Insights Admin/g'

          cat > README.md <<'README'
          # Agency Insights

          Recruiter-safe portfolio edition of an agency performance intelligence platform. The application preserves the original product architecture and UI while using a personal Firebase project and synthetic demonstration data.
          README
          printf '%s\n' '{"name":"Agency Insights","description":"Agency performance management and client operations intelligence console."}' > metadata.json
          printf '%s\n' '{"firebaseProjectId":"agency-insights-bd711"}' > studio.json
          printf '%s\n' '{"projects":{"default":"agency-insights-bd711"}}' > .firebaserc

          cat > .env.example <<'ENV_EXAMPLE'
          NEXT_PUBLIC_FIREBASE_API_KEY=
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=agency-insights-bd711.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=agency-insights-bd711
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=agency-insights-bd711.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=1073410118110
          NEXT_PUBLIC_FIREBASE_APP_ID=1:1073410118110:web:23efe8de8640e668c08d4f
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=G-Y98SGQCNM2
          GOOGLE_GENAI_API_KEY=
          NEXT_PUBLIC_DEMO_MODE=true
          ENV_EXAMPLE
          cat > functions/.env.example <<'FUNCTIONS_ENV'
          SHEETS_SPREADSHEET_ID=
          SHEETS_TAB_NAME=ActionItems
          MS_GRAPH_TENANT_ID=
          MS_GRAPH_CLIENT_ID=
          MS_GRAPH_SENDER=alerts@example.com
          EMAIL_FROM_NAME=Agency Insights Alerts
          APP_BASE_URL=https://agency-insights-demo.example.com
          FUNCTIONS_ENV
          perl -pi -e 's/1NnLAuCjA4ZeaH116jzbVVajkYX3lytxbZVxOGocLWSs//g' functions/src/index.ts
          cat > functions/README.md <<'FUNCTIONS_README'
          # Agency Insights Cloud Functions

          Optional Firebase Cloud Functions for Sheets mirroring and notification workflows. The public portfolio demo runs the Next.js application directly against Firebase Auth and Firestore and does not require these functions.

          Keep service-account, Microsoft Graph, mailbox, and other credentials in Firebase secrets or deployment environment variables. Never commit private credentials.
          FUNCTIONS_README

          cat > src/firebase/config.ts <<'FIREBASE_CONFIG'
          const firebaseConfig = {
            apiKey: process.env.NEXT_PUBLIC_FIREBASE_API_KEY || '',
            authDomain: process.env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || '',
            projectId: process.env.NEXT_PUBLIC_FIREBASE_PROJECT_ID || '',
            storageBucket: process.env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || '',
            messagingSenderId: process.env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '',
            appId: process.env.NEXT_PUBLIC_FIREBASE_APP_ID || '',
            measurementId: process.env.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || '',
          };
          export { firebaseConfig };
          FIREBASE_CONFIG
          cat > src/lib/demo-mode.ts <<'DEMO_MODE'
          export const isDemoMode = process.env.NEXT_PUBLIC_DEMO_MODE !== 'false';
          DEMO_MODE
          cat > firestore.rules <<'RULES'
          rules_version = '2';
          service cloud.firestore {
            match /databases/{database}/documents {
              function signedIn() { return request.auth != null; }
              function admin() { return signedIn() && exists(/databases/$(database)/documents/users/$(request.auth.uid)) && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role == 'Admin'; }
              match /users/{id} { allow read: if signedIn(); allow create: if signedIn() && request.auth.uid == id; allow update: if signedIn() && (request.auth.uid == id || admin()); allow delete: if admin(); }
              match /{document=**} { allow read, write: if signedIn(); }
            }
          }
          RULES

          cat > src/lib/demo-seed.ts <<'DEMO_SEED'
          'use client';
          import { collection, doc, getDocs, limit, query, writeBatch, type Firestore } from 'firebase/firestore';
          import { format, subMonths, subWeeks, startOfMonth, startOfWeek } from 'date-fns';
          const clients=[['CLID0081','Orion Retail','RETAIL','NORTH','Asha Mehta','Rohan Shah'],['CLID0084','Nova Mobility','MOBILITY','WEST','Kabir Rao','Maya Iyer'],['CLID0102','Atlas Finance','FINANCE','SOUTH','Neha Kapoor','Arjun Sen'],['CLID0114','Northstar Travel','TRAVEL','WEST','Vikram Jain','Ishita Rao'],['CLID0128','Ember Health','HEALTHCARE','NORTH','Priya Nair','Aditya Bose'],['CLID0141','Vertex Electronics','CONSUMER TECH','SOUTH','Sameer Kulkarni','Tara Menon']] as const;
          const channels=['Google','Meta','LinkedIn','YouTube']; const teams=['ORION','NOVA','ATLAS','NORTHSTAR'];
          async function put(db:Firestore,rows:any[]){for(let i=0;i<rows.length;i+=450){const b=writeBatch(db);rows.slice(i,i+450).forEach(r=>b.set(doc(db,r.p),r.d,{merge:true}));await b.commit();}}
          export async function seedDemoData(db:Firestore){if(!(await getDocs(query(collection(db,'clients'),limit(1)))).empty)return false;const now=new Date(),months=Array.from({length:12},(_,i)=>format(subMonths(startOfMonth(now),11-i),'yyyy-MM')),week0=startOfWeek(now,{weekStartsOn:1}),weeks=Array.from({length:8},(_,i)=>startOfWeek(subWeeks(week0,7-i),{weekStartsOn:1}));const rows:any[]=[];
          clients.forEach((c,ci)=>months.forEach((m,mi)=>{channels.forEach((ch,chi)=>{const id=`m_${c[0]}_${m}_${chi}`;rows.push({p:`monthlySpends/${id}`,d:{uploadRecordId:id,clientId:c[0],brandName:c[1],industry:c[2],type:'PERFORMANCE',subEntity:c[3],channelVendor:ch,currency:'INR',team:teams[ci%4],month:m,actualSpendsInr:Math.round((650000+ci*90000+mi*18000)*(0.8+chi*.12))}});});[['ROAS','PRIMARY','ASC',4.2+ci*.1,3.7+(mi%5)*.18],['Leads','PRIMARY','ASC',240+ci*30,210+(mi*17+ci*11)%120],['CPA','NON-PRIMARY','DESC',850-ci*15,740+(mi*23+ci*9)%170]].forEach((k,ki)=>{const id=`k_${c[0]}_${m}_${ki}`;rows.push({p:`kpis/${id}`,d:{month:m,clientId:c[0],clientName:c[1],cluster:c[2],channel:channels[(ci+ki)%4],kpi:k[0],kpiType:k[1],type:'Performance',direction:k[2],currency:'INR',lob:c[3],cduLead:c[4],emCsm:c[5],targetMonth:k[3],achievedMonthTillYesterday:k[4],targetMonthTillYesterday:k[3]*.92,uploadRecordId:id}});for(let w=1;w<=5;w++)rows.push({p:`kpiWeeklyData/${id}_w${w}`,d:{kpiDataId:id,weekOfMonth:w,month:m,target:k[3],achieved:k[4]+((w%3)-1)*.12,comment:w===4?`${k[0]} pacing reviewed with the team.`:''}});});}));
          weeks.forEach((ws,wi)=>clients.forEach((c,ci)=>channels.forEach((ch,chi)=>{const week=format(ws,'yyyy-MM-dd'),id=`w_${c[0]}_${week}_${chi}`;rows.push({p:`weeklySpends/${id}`,d:{uploadRecordId:id,clientId:c[0],brandName:c[1],industry:c[2],type:'PERFORMANCE',subEntity:c[3],channelVendor:ch,currency:'INR',team:teams[ci%4],week,month:format(ws,'yyyy-MM'),spendsInr:Math.round((150000+ci*20000)*(0.85+chi*.08)*(1+wi*.025))}}))));
          const cycle=format(week0,'yyyy-MM-dd');clients.forEach((c,ci)=>rows.push({p:`wbrEntries/wbr_${c[0]}_${cycle}`,d:{clientId:c[0],clientName:c[1],cluster:c[2],clusterLead:c[4],emcsm:c[5],clientPartner:'Demo Partner',wbrDate:cycle,contractStatus:'Valid',engagementRag:ci%4===3?'Amber':'Green',performanceRag:ci%4===2?'Red':ci%4===1?'Amber':'Green',financeIssues:'No material finance issues.',summary:ci%4===2?'Recovery actions are being tracked weekly.':'Performance remains broadly on plan.',updatedAt:new Date().toISOString()}}));
          for(let i=0;i<12;i++){const c=clients[i%clients.length],id=`demo_action_${i+1}`;rows.push({p:`actionItems/${id}`,d:{id,taskName:['Review channel pacing','Refresh client WBR','Close tracking gap','Validate forecast'][i%4],description:'Synthetic portfolio action for demonstration.',assignedTo:'Demo Team',section:['CLIENT ENGAGEMENT','SALES','OPERATIONS','AGENCY INSIGHTS','HR','MANAGEMENT'][i%6],clientId:c[0],clientName:c[1],comment:'',status:['Work-In Progress','Completed','Overdue','On-Hold'][i%4],priority:['Low','Medium','High','Critical'][i%4],dueDate:format(new Date(Date.now()+(i-5)*86400000),'yyyy-MM-dd'),createdAt:new Date(Date.now()-i*86400000).toISOString(),updatedAt:new Date().toISOString()}});}
          for(let i=0;i<10;i++)rows.push({p:`leads/demo_lead_${i+1}`,d:{companyName:['Pioneer Foods','Lumen Living','Cedar Finance','Orbit Learning','Harbor Hotels'][i%5],phone:'',status:['Qualified','Pitch','Negotiation','Contract','Won','Lost'][i%6],services:['Performance','SEO','Creatives'][i%3],estimatedValue:1200000+i*150000,notes:'Synthetic opportunity for portfolio demonstration.',opportunityOwner:['Aarav','Meera','Dev','Riya'][i%4],expectedSpends:450000+i*50000,teamAssigned:teams[i%4],expectedGoLiveDate:format(new Date(Date.now()+(15+i)*86400000),'yyyy-MM-dd'),pitchDate:format(new Date(Date.now()-(i+2)*86400000),'yyyy-MM-dd'),updatedAt:new Date().toISOString()}});
          await put(db,clients.map(c=>({p:`clients/${c[0]}`,d:{uniqueId:c[0],name:c[1],cluster:c[2],subEntity:c[3],clusterLead:c[4],emcsm:c[5],clientPartner:'Demo Partner'}})));await put(db,channels.map(n=>({p:`channels/${n.toLowerCase()}`,d:{name:n}})));await put(db,['ROAS','Leads','Revenue','CPA','Conversion Rate','GMV','Orders','New Customers'].map(n=>({p:`kpiDefinitions/${n.toLowerCase().replaceAll(' ','-')}`,d:{name:n}})));await put(db,rows);return true;}
          DEMO_SEED

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/ai/flows/business-snapshot-flow.ts'); s=p.read_text()
          old="""export async function generateBusinessSnapshot(input: BusinessSnapshotInput): Promise<BusinessSnapshotOutput> {
            const { output } = await snapshotPrompt(input);
            if (!output) throw new Error('AI failed to generate business snapshot.');
            return output;
          }
          """
          new="""function fallbackSnapshot(input: BusinessSnapshotInput): BusinessSnapshotOutput {
            return { snapshot: `**📈 KPI PERFORMANCE**\n1. Portfolio health is ${input.performance.green} Green / ${input.performance.amber} Amber / ${input.performance.red} Red across ${input.performance.totalClients} clients.\n\n**💸 SPENDS STRATEGY**\n1. Current-month spends are ₹${Math.round(input.spends.currentMonthTotal).toLocaleString('en-IN')}, with a ${input.spends.variance.toFixed(1)}% month-on-month variance.\n\n**💬 TEAM INTELLIGENCE**\n1. Weekly comments and action signals indicate active pacing and optimisation work across the portfolio.\n2. Continue closing the highest-impact actions in the next review cycle.` };
          }

          export async function generateBusinessSnapshot(input: BusinessSnapshotInput): Promise<BusinessSnapshotOutput> {
            if (!process.env.GOOGLE_GENAI_API_KEY && !process.env.GEMINI_API_KEY) return fallbackSnapshot(input);
            const { output } = await snapshotPrompt(input);
            if (!output) throw new Error('AI failed to generate business snapshot.');
            return output;
          }
          """
          if old not in s: raise SystemExit('snapshot function not found')
          p.write_text(s.replace(old,new))
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/firestore-actions.ts'); s=p.read_text()
          s=s.replace("import { parseKpiDirection } from './kpi-rag';", "import { parseKpiDirection } from './kpi-rag';\nimport { isDemoMode } from './demo-mode';")
          s=s.replace("if (!/^[^@]+@dentsu\\.com$/.test(email)) {", "if (!isDemoMode && !email.includes('@')) {")
          s=s.replace("throw new Error('Only @dentsu.com email addresses can be invited.');", "throw new Error('Please provide a valid email address.');")
          s=s.replace("throw new Error('Only @dentsu.com email addresses can request access.');", "throw new Error('Please provide a valid email address.');")
          s=s.replace("await sendEmailVerification(userCredential.user);", "if (!isDemoMode) await sendEmailVerification(userCredential.user);")
          marker="export const createUser = async (db: Firestore, userData: any) => {"
          helper="""export const ensureDemoUserProfile = async (db: Firestore, user: User, email: string, displayName?: string) => {
            if (!isDemoMode) return;
            await setDoc(doc(db, 'users', user.uid), { uid: user.uid, email: email.trim().toLowerCase(), displayName: displayName || email.split('@')[0] || 'Demo User', photoURL: user.photoURL || '', role: 'Admin', status: 'User Registered', permissions: ['snapshot','tracker','wbr','actions','spends','dashboard','forecast','sales','admin'] }, { merge: true });
          };

          """
          s=s.replace(marker,helper+marker)
          s=s.replace("status: 'Pending',", "status: isDemoMode ? 'User Registered' : 'Pending',")
          s=s.replace("role: 'Client Partner',", "role: isDemoMode ? 'Admin' : 'Client Partner',")
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/page.tsx'); s=p.read_text()
          s=s.replace("import { signInWithEmailAndPassword } from 'firebase/auth';", "import { createUserWithEmailAndPassword, sendPasswordResetEmail, signInWithEmailAndPassword } from 'firebase/auth';")
          s=s.replace("import { useAuth, useUser, useFirebaseApp } from '@/firebase';", "import { useAuth, useUser, useFirebaseApp, useFirestore } from '@/firebase';")
          s=s.replace("import { Button } from '@/components/ui/button';", "import { Button } from '@/components/ui/button';\nimport { ensureDemoUserProfile } from '@/lib/firestore-actions';\nimport { isDemoMode } from '@/lib/demo-mode';\nimport { seedDemoData } from '@/lib/demo-seed';")
          s=s.replace("  const auth = useAuth();\n  const app = useFirebaseApp();", "  const auth = useAuth();\n  const firestore = useFirestore();\n  const app = useFirebaseApp();")
          old="""  const handleLogin = async (e: React.FormEvent) => {
            e.preventDefault();
            setIsLoggingIn(true);
            setError(null);
            try {
              await signInWithEmailAndPassword(auth, email, password);
              router.push('/dashboard');
            } catch (error: any) {
              setError('Invalid credentials or unauthorized account.');
            } finally {
              setIsLoggingIn(false);
            }
          };"""
          new="""  const handleLogin = async (e: React.FormEvent) => {
            e.preventDefault(); setIsLoggingIn(true); setError(null);
            try {
              let credential;
              try { credential = await signInWithEmailAndPassword(auth, email.trim().toLowerCase(), password); }
              catch (err:any) { if (!isDemoMode || !['auth/user-not-found','auth/invalid-credential','auth/invalid-email'].includes(err?.code)) throw err; credential = await createUserWithEmailAndPassword(auth, email.trim().toLowerCase(), password); }
              if (isDemoMode) { await ensureDemoUserProfile(firestore, credential.user, email); await seedDemoData(firestore); }
              router.push('/dashboard');
            } catch (error:any) { setError(isDemoMode ? 'Demo sign-in failed. Use a valid email format and a password of at least 6 characters.' : 'Invalid credentials or unauthorized account.'); }
            finally { setIsLoggingIn(false); }
          };"""
          s=s.replace(old,new)
          s=s.replace("    if (user) router.push('/dashboard');\n  }, [user, router]);", "    if (user && !isLoggingIn) router.push('/dashboard');\n  }, [user, router, isLoggingIn]);")
          s=s.replace('placeholder="name@dentsu.com"','placeholder={isDemoMode ? "name@example.com" : "name@company.com"}')
          s=s.replace('AZTEC Control Center','AGENCY INSIGHTS')
          p.write_text(s)
          PY

          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/register/page.tsx'); s=p.read_text()
          s=s.replace("import { Label } from '@/components/ui/label';", "import { Label } from '@/components/ui/label';\nimport { isDemoMode } from '@/lib/demo-mode';\nimport { seedDemoData } from '@/lib/demo-seed';")
          s=s.replace("if (!normalizedEmail.endsWith('@dentsu.com')) {", "if (!normalizedEmail.includes('@')) {")
          s=s.replace("setError('Access requests are limited to verified @dentsu.com email addresses.');", "setError('Please enter a valid email address.');")
          s=s.replace("      router.push('/awaiting-approval');", "      if (isDemoMode) await seedDemoData(firestore);\n      router.push(isDemoMode ? '/dashboard' : '/awaiting-approval');")
          s=s.replace('placeholder="name@dentsu.com"','placeholder={isDemoMode ? "name@example.com" : "name@company.com"}')
          s=s.replace('Join AZTEC','Join Agency Insights')
          p.write_text(s)
          PY

          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import sanitized application source"
          git push
